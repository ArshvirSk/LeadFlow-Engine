# Koyeb service manifest — LeadFlow API
# Deploy via Koyeb dashboard or CLI:
#   koyeb app create leadflow-api
#   koyeb service create \
#     --app leadflow-api \
#     --name api \
#     --docker-dockerfile packages/api/Dockerfile \
#     --ports 3000:http \
#     --routes /:3000 \
#     --checks 3000:http:/health \
#     --regions was \
#     --instance-type nano \
#     --env NODE_ENV=production \
#     --env PORT=3000 \
#     --env DATABASE_URL=<secret> \
#     --env REDIS_URL=<secret> \
#     --env CLERK_SECRET_KEY=<secret> \
#     --env CLERK_WEBHOOK_SECRET=<secret> \
#     --env ANTHROPIC_API_KEY=<secret> \
#     --env OPENAI_API_KEY=<secret> \
#     --env CRUNCHBASE_API_KEY=<secret> \
#     --env REDDIT_CLIENT_ID=<secret> \
#     --env REDDIT_CLIENT_SECRET=<secret> \
#     --env REDDIT_USER_AGENT="leadflow-engine/1.0" \
#     --env RESEND_API_KEY=<secret> \
#     --env ENCRYPTION_KEY=<secret> \
#     --env HMAC_SECRET=<secret> \
#     --env LOG_LEVEL=info \
#     --git-url https://github.com/<you>/leadflow-engine \
#     --git-branch main

name: leadflow-api
services:
  - name: api
    type: web
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    checks:
      - type: http
        path: /health
        port: 3000
        initial_delay: 15
        period: 30
        timeout: 5
    instance_type: nano    # 256 MB RAM, 0.1 vCPU — free tier
    regions:
      - was                # Washington DC — change to: fra (EU), sin (Asia)
    scaling:
      min: 1
      max: 1               # keep at 1 on free tier
    docker:
      dockerfile: packages/api/Dockerfile
      # Build context must be repo root for pnpm workspace to resolve
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
      # Set these as secrets in Koyeb dashboard — never commit values:
      # DATABASE_URL, REDIS_URL, CLERK_SECRET_KEY, CLERK_WEBHOOK_SECRET,
      # ANTHROPIC_API_KEY, OPENAI_API_KEY, CRUNCHBASE_API_KEY,
      # REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, RESEND_API_KEY,
      # ENCRYPTION_KEY, HMAC_SECRET
